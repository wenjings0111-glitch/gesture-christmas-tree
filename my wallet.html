<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷记账 PWA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: var(--primary-color); margin-bottom: 20px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        /* 统计样式 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .stat-box h3 { margin: 5px 0; font-size: 14px; color: #666; }
        .stat-box p { margin: 5px 0; font-size: 20px; font-weight: bold; color: var(--primary-color); }
        
        /* 输入框样式 */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        /* 热门/热气分类按钮 */
        .hot-categories { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .category-btn {
            background: #e1ecf8;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .category-btn.active {
            background: var(--primary-color);
            color: white;
        }
        
        .submit-btn {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .history-list { max-height: 200px; overflow-y: auto; padding: 0; list-style: none; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 极速快捷记账</h2>

    <!-- 1. 看数据：今天 vs 这个月 -->
    <div class="card stats-grid">
        <div class="stat-box" style="border-right: 1px solid #eee;">
            <h3>今天花费</h3>
            <p id="today-total">RM 0.00</p>
        </div>
        <div class="stat-box">
            <h3>本月花费</h3>
            <p id="month-total">RM 0.00</p>
        </div>
    </div>

    <!-- 2. 记账表单 -->
    <div class="card">
        <input type="number" id="amount" inputmode="decimal" placeholder="输入金额 (例如: 15.50)" required>
        
        <label style="font-size: 14px; color: #666;">🔥 热门分类 (点击直接选择)：</label>
        <div class="hot-categories" id="hot-cats">
            <!-- 动态生成热门分类 -->
        </div>
        
        <input type="text" id="remark" placeholder="备注（选填，如：午餐鸡饭）">
        <button class="submit-btn" onclick="addRecord()">📥 记一笔</button>
    </div>

    <!-- 3. 最近记录 -->
    <div class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #444;">最近账目记录</h3>
        <ul class="history-list" id="history-list">
            <!-- 动态记录 -->
        </ul>
    </div>
</div>

<script>
    // 初始分类与其点击热度（次数）
    let categories = JSON.parse(localStorage.getItem('hot_categories')) || {
        "餐饮": 10, "交通": 5, "购物": 3, "娱乐": 2, "零食": 1, "其他": 0
    };
    
    let selectedCategory = "餐饮";
    let records = JSON.parse(localStorage.getItem('expense_records')) || [];

    // 初始化渲染
    function init() {
        renderCategories();
        renderStats();
        renderHistory();
    }

    // 渲染热门分类（按热度降序排列）
    function renderCategories() {
        const catContainer = document.getElementById('hot-cats');
        catContainer.innerHTML = '';
        
        // 排序
        const sortedCats = Object.entries(categories).sort((a, b) => b[1] - a[1]);
        
        sortedCats.forEach(([cat, count], index) => {
            const btn = document.createElement('button');
            btn.className = `category-btn ${cat === selectedCategory ? 'active' : ''}`;
            // 最热的前两个加上 🔥 火热标志
            btn.innerText = (index < 2 ? '🔥 ' : '') + cat;
            btn.onclick = () => {
                selectedCategory = cat;
                renderCategories();
            };
            catContainer.appendChild(btn);
        });
    }

    // 记账逻辑
    function addRecord() {
        const amountInput = document.getElementById('amount');
        const remarkInput = document.getElementById('remark');
        const amount = parseFloat(amountInput.value);
        
        if (!amount || amount <= 0) {
            alert('请输入正确的金额！');
            return;
        }

        const now = new Date();
        const newRecord = {
            id: Date.now(),
            amount: amount,
            category: selectedCategory,
            remark: remarkInput.value || selectedCategory,
            date: now.toISOString().split('T')[0], // YYYY-MM-DD
            month: now.toISOString().slice(0, 7)    // YYYY-MM
        };

        records.unshift(newRecord); // 最新记录放前面
        categories[selectedCategory] += 1; // 增加该分类的热度

        // 存入 LocalStorage
        localStorage.setItem('expense_records', JSON.stringify(records));
        localStorage.setItem('hot_categories', JSON.stringify(categories));

        // 清空输入框
        amountInput.value = '';
        remarkInput.value = '';

        // 重新刷新界面
        init();
    }

    // 计算并渲染今天和本月的花费
    function renderStats() {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const monthStr = now.toISOString().slice(0, 7);

        let todayTotal = 0;
        let monthTotal = 0;

        records.forEach(r => {
            if (r.date === todayStr) todayTotal += r.amount;
            if (r.month === monthStr) monthTotal += r.amount;
        });

        document.getElementById('today-total').innerText = `RM ${todayTotal.toFixed(2)}`;
        document.getElementById('month-total').innerText = `RM ${monthTotal.toFixed(2)}`;
    }

    // 渲染最近历史纪录
    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        records.slice(0, 20).forEach(r => { // 只显示最近20条
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <span><b>[${r.category}]</b> ${r.remark} <small style="color:#999;font-size:11px;">(${r.date})</small></span>
                <span style="color:#e74c3c;font-weight:bold;">-RM ${r.amount.toFixed(2)}</span>
            `;
            list.appendChild(li);
        });
    }

    // 启动
    init();
</script>
</body>
</html>
